name: Manual Update External Resources

on:
  workflow_dispatch:
    inputs:
      core_branch:
        description: "Scardice-core submodule branch"
        required: false
        default: "master"
      ui_branch:
        description: "Scardice-ui submodule branch"
        required: false
        default: "master"

permissions:
  contents: write

concurrency:
  group: update-external-resources
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      CORE_BRANCH: ${{ github.event.inputs.core_branch || 'master' }}
      UI_BRANCH: ${{ github.event.inputs.ui_branch || 'master' }}

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update core/ui to selected branches
        run: |
          set -euo pipefail

          git submodule update --init --recursive

          echo "Updating Scardice-core to ${CORE_BRANCH}"
          git -C Scardice-core fetch origin "${CORE_BRANCH}"
          git -C Scardice-core checkout -B "${CORE_BRANCH}" FETCH_HEAD

          echo "Updating Scardice-ui to ${UI_BRANCH}"
          git -C Scardice-ui fetch origin "${UI_BRANCH}"
          git -C Scardice-ui checkout -B "${UI_BRANCH}" FETCH_HEAD

      - name: Update other submodules to remote default branch
        run: |
          set -euo pipefail

          git submodule foreach --recursive '
            if [ "$name" = "Scardice-core" ] || [ "$name" = "Scardice-ui" ]; then
              echo "Skipping $name because it is handled separately"
              exit 0
            fi

            default_branch=$(git remote show origin | awk "/HEAD branch/ {print \$NF}")

            if [ -z "$default_branch" ]; then
              default_branch="master"
            fi

            echo "Updating $name to origin/${default_branch}"
            git fetch origin --prune
            git reset --hard "origin/${default_branch}"
          '

      - name: Show submodule status
        run: |
          git submodule status --recursive
          git status --porcelain

      - name: Commit and push changes
        run: |
          set -euo pipefail

          echo "Repository status:"
          git status --porcelain

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected, nothing to commit"
            exit 0
          fi

          git add -A

          if git diff --staged --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi

          git commit -m "chore: update external resources"

          BRANCH="${GITHUB_REF_NAME}"
          echo "Pushing changes to ${BRANCH}"
          git push origin "HEAD:${BRANCH}"
