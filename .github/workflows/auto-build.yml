name: Manual Build

on:
  workflow_dispatch:
    inputs:
      core_branch:
        description: "Scardice-core branch"
        required: true
        default: "master"
        type: string
      ui_branch:
        description: "Nested Scardice-ui branch"
        required: true
        default: "master"
        type: string
      version_main:
        description: "VERSION_MAIN; empty uses the value from dice/version.go"
        required: false
        default: ""
        type: string
      version_prerelease:
        description: "VERSION_PRERELEASE"
        required: true
        default: "-dev"
        type: string
      app_channel:
        description: "APP_CHANNEL"
        required: true
        default: "dev"
        type: string
      app_name:
        description: "APPNAME"
        required: true
        default: "Scardice"
        type: string
      build_mode:
        description: "single uses one target; multi uses the comma-separated targets list"
        required: true
        default: "multi"
        type: choice
        options:
          - multi
          - single
      targets:
        description: "single: one GOOS/GOARCH; multi: comma-separated GOOS/GOARCH list"
        required: true
        default: "linux/amd64,windows/amd64"
        type: string
      enable_cgo:
        description: "Enable CGO; cross-compilers are installed for supported targets"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      options:
        description: "CSV: compatible_names=false,use_upx=false,pack_runtime_assets=true,runtime_assets_strict=true,runtime_cache_ttl=86400,download_retries=3,runtime_connections=4"
        required: true
        default: "compatible_names=false,use_upx=false,pack_runtime_assets=true,runtime_assets_strict=true,runtime_cache_ttl=86400,download_retries=3,runtime_connections=4"
        type: string

permissions:
  contents: read

concurrency:
  group: scardice-manual-build
  cancel-in-progress: false

env:
  # Optional repository secrets. They are written to temporary files only when set.
  BUILD_PROXY: ${{ secrets.BUILD_PROXY }}
  TRUSTED_CLIENT_PRIVATE_KEY: ${{ secrets.SCARDICE_TRUSTED_CLIENT_PRIVATE_KEY }}
  SIGN_CLIENT_PRIVATE_KEY: ${{ secrets.SCARDICE_SIGN_CLIENT_PRIVATE_KEY }}
  SIGN_V3_URL: ${{ secrets.SCARDICE_SIGN_V3_URL }}

jobs:
  build:
    name: Build with Scardice-core/build.sh
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Select core and UI branches
        env:
          CORE_BRANCH: ${{ inputs.core_branch }}
          UI_BRANCH: ${{ inputs.ui_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git -C Scardice-core fetch --no-tags origin "$CORE_BRANCH"
          git -C Scardice-core checkout --detach FETCH_HEAD
          git -C Scardice-core submodule sync --recursive
          git -C Scardice-core submodule update --init --recursive

          # build.sh runs `git submodule update --remote` from Scardice-core.
          # Set the nested UI branch before invoking it so the selected ref survives.
          git -C Scardice-core config -f .gitmodules submodule.Scardice-ui.branch "$UI_BRANCH"
          git -C Scardice-core submodule sync --recursive
          git -C Scardice-core/Scardice-ui fetch --no-tags origin "$UI_BRANCH"
          git -C Scardice-core/Scardice-ui checkout --detach FETCH_HEAD

          git submodule status --recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Scardice-core/go.mod
          cache: false

      - name: Set up Node and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Scardice-core/Scardice-ui/pnpm-lock.yaml

      - name: Install build utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep zip

      - name: Install requested cross-compilers and UPX
        env:
          BUILD_MODE_INPUT: ${{ inputs.build_mode }}
          TARGETS_INPUT: ${{ inputs.targets }}
          ENABLE_CGO_INPUT: ${{ inputs.enable_cgo }}
          OPTIONS_INPUT: ${{ inputs.options }}
        shell: bash
        run: |
          set -euo pipefail

          selected_targets="${TARGETS_INPUT//[[:space:]]/}"
          if [[ "$BUILD_MODE_INPUT" == "single" ]]; then
            if [[ ! "$selected_targets" =~ ^[^/,]+/[^/,]+$ ]]; then
              echo "single mode requires exactly one GOOS/GOARCH target" >&2
              exit 1
            fi
          fi

          use_upx=false
          IFS=',' read -r -a option_list <<< "$OPTIONS_INPUT"
          for option in "${option_list[@]}"; do
            key="${option%%=*}"
            value="${option#*=}"
            if [[ "$key" == "use_upx" ]]; then
              use_upx="$value"
            fi
          done

          packages=()
          if [[ "$ENABLE_CGO_INPUT" == "true" ]]; then
            IFS=',' read -r -a target_list <<< "$selected_targets"
            for target in "${target_list[@]}"; do
              case "${target//[[:space:]]/}" in
                windows/amd64) packages+=(gcc-mingw-w64-x86-64) ;;
                windows/386) packages+=(gcc-mingw-w64-i686) ;;
                linux/arm64) packages+=(gcc-aarch64-linux-gnu) ;;
              esac
            done
          fi

          if [[ "$use_upx" == "true" ]]; then
            if ! command -v upx >/dev/null 2>&1; then
              sudo apt-get install -y upx-ucl || sudo apt-get install -y upx
            fi
          fi

          if ((${#packages[@]} > 0)); then
            sudo apt-get install -y "${packages[@]}"
          fi

      - name: Prepare optional signing files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${TRUSTED_CLIENT_PRIVATE_KEY:-}" ]]; then
            mkdir -p Scardice-core/signature
            printf '%s' "$TRUSTED_CLIENT_PRIVATE_KEY" > Scardice-core/signature/seal_trusted_private_key.pem
          fi
          if [[ -n "${SIGN_CLIENT_PRIVATE_KEY:-}" ]]; then
            mkdir -p Scardice-core/signature
            printf '%s' "$SIGN_CLIENT_PRIVATE_KEY" > Scardice-core/signature/seal_sign_private_key.bin
          fi
          if [[ -n "${SIGN_V3_URL:-}" ]]; then
            mkdir -p Scardice-core/signature
            printf '%s' "$SIGN_V3_URL" > Scardice-core/signature/SealSignV3Url
          fi

      - name: Run build.sh
        env:
          VERSION_MAIN_INPUT: ${{ inputs.version_main }}
          VERSION_PRERELEASE_INPUT: ${{ inputs.version_prerelease }}
          APP_CHANNEL_INPUT: ${{ inputs.app_channel }}
          APP_NAME_INPUT: ${{ inputs.app_name }}
          BUILD_MODE_INPUT: ${{ inputs.build_mode }}
          TARGETS_INPUT: ${{ inputs.targets }}
          ENABLE_CGO_INPUT: ${{ inputs.enable_cgo }}
          OPTIONS_INPUT: ${{ inputs.options }}
        working-directory: Scardice-core
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_MODE_INPUT" in
            single|multi) ;;
            *) echo "Unsupported build mode: $BUILD_MODE_INPUT" >&2; exit 1 ;;
          esac

          COMPATIBLE_NAMES_INPUT=false
          USE_UPX_INPUT=false
          PACK_RUNTIME_ASSETS_INPUT=true
          RUNTIME_ASSETS_STRICT_INPUT=true
          RUNTIME_CACHE_TTL_INPUT=86400
          DOWNLOAD_RETRIES_INPUT=3
          RUNTIME_CONNECTIONS_INPUT=4
          IFS=',' read -r -a option_list <<< "$OPTIONS_INPUT"
          for option in "${option_list[@]}"; do
            key="${option%%=*}"
            value="${option#*=}"
            if [[ "$key" == "$option" ]]; then
              echo "Invalid option (expected key=value): $option" >&2
              exit 1
            fi
            case "$key" in
              compatible_names) COMPATIBLE_NAMES_INPUT="$value" ;;
              use_upx) USE_UPX_INPUT="$value" ;;
              pack_runtime_assets) PACK_RUNTIME_ASSETS_INPUT="$value" ;;
              runtime_assets_strict) RUNTIME_ASSETS_STRICT_INPUT="$value" ;;
              runtime_cache_ttl) RUNTIME_CACHE_TTL_INPUT="$value" ;;
              download_retries) DOWNLOAD_RETRIES_INPUT="$value" ;;
              runtime_connections) RUNTIME_CONNECTIONS_INPUT="$value" ;;
              *) echo "Unsupported build option: $key" >&2; exit 1 ;;
            esac
          done

          if [[ ! "$RUNTIME_CACHE_TTL_INPUT" =~ ^[0-9]+$ ]]; then
            echo "runtime_cache_ttl must be a non-negative integer" >&2
            exit 1
          fi
          if [[ ! "$DOWNLOAD_RETRIES_INPUT" =~ ^[0-9]+$ ]]; then
            echo "download_retries must be a non-negative integer" >&2
            exit 1
          fi
          if [[ ! "$RUNTIME_CONNECTIONS_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "runtime_connections must be a positive integer" >&2
            exit 1
          fi

          for boolean_option in \
            "$COMPATIBLE_NAMES_INPUT" \
            "$USE_UPX_INPUT" \
            "$PACK_RUNTIME_ASSETS_INPUT" \
            "$RUNTIME_ASSETS_STRICT_INPUT"; do
            case "$boolean_option" in
              true|false) ;;
              *) echo "Boolean build options must be true or false" >&2; exit 1 ;;
            esac
          done

          single_goos=""
          single_goarch=""
          if [[ "$BUILD_MODE_INPUT" == "single" ]]; then
            single_target="${TARGETS_INPUT//[[:space:]]/}"
            if [[ ! "$single_target" =~ ^[^/,]+/[^/,]+$ ]]; then
              echo "single mode requires exactly one GOOS/GOARCH target" >&2
              exit 1
            fi
            single_goos="${single_target%%/*}"
            single_goarch="${single_target##*/}"
          fi

          goos_index() {
            case "$1" in
              linux) echo 1 ;;
              windows) echo 2 ;;
              darwin) echo 3 ;;
              freebsd) echo 4 ;;
              openbsd) echo 5 ;;
              netbsd) echo 6 ;;
              *) echo "Unsupported GOOS: $1" >&2; exit 1 ;;
            esac
          }

          goarch_index() {
            case "$1" in
              amd64) echo 1 ;;
              arm64) echo 2 ;;
              386) echo 3 ;;
              arm) echo 4 ;;
              ppc64le) echo 5 ;;
              riscv64) echo 6 ;;
              s390x) echo 7 ;;
              *) echo "Unsupported GOARCH: $1" >&2; exit 1 ;;
            esac
          }

          if [[ "$PACK_RUNTIME_ASSETS_INPUT" == "true" ]]; then
            export PACK_RUNTIME_ASSETS=1
          else
            export PACK_RUNTIME_ASSETS=0
          fi
          if [[ "$RUNTIME_ASSETS_STRICT_INPUT" == "true" ]]; then
            export RUNTIME_ASSETS_STRICT=1
          else
            export RUNTIME_ASSETS_STRICT=0
          fi
          export RUNTIME_CACHE_TTL_SECONDS="$RUNTIME_CACHE_TTL_INPUT"
          export DOWNLOAD_RETRIES="$DOWNLOAD_RETRIES_INPUT"
          export RUNTIME_AXEL_CONNECTIONS="$RUNTIME_CONNECTIONS_INPUT"

          if [[ "$BUILD_MODE_INPUT" == "single" ]]; then
            target_input_lines=(
              "$VERSION_MAIN_INPUT"
              "$VERSION_PRERELEASE_INPUT"
              "$APP_CHANNEL_INPUT"
              "$APP_NAME_INPUT"
              "$BUILD_MODE_INPUT"
              "$(goos_index "$single_goos")"
              "$(goarch_index "$single_goarch")"
            )
          else
            target_input_lines=(
              "$VERSION_MAIN_INPUT"
              "$VERSION_PRERELEASE_INPUT"
              "$APP_CHANNEL_INPUT"
              "$APP_NAME_INPUT"
              "$BUILD_MODE_INPUT"
              "$TARGETS_INPUT"
            )
          fi

          if [[ "$ENABLE_CGO_INPUT" == "true" ]]; then
            target_input_lines+=(y)
          else
            target_input_lines+=(n)
          fi
          if [[ "$COMPATIBLE_NAMES_INPUT" == "true" ]]; then
            target_input_lines+=(y)
          else
            target_input_lines+=(n)
          fi

          # build.sh asks about UPX only when the command exists. Account for
          # both the requested and the runner-provided cases so later answers
          # never get shifted into the wrong prompt.
          if command -v upx >/dev/null 2>&1; then
            if [[ "$USE_UPX_INPUT" == "true" ]]; then
              target_input_lines+=(y)
            else
              target_input_lines+=(n)
            fi
          fi

          printf '%s\n' "${target_input_lines[@]}" | bash ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show generated packages
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find Scardice-core/output -maxdepth 1 -type f -printf '%f\t%k KB\n' | sort

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scardice-build-${{ github.run_number }}
          path: |
            Scardice-core/output/**
            build.log
          if-no-files-found: warn
          retention-days: 14
