name: Update submodules daily

on:
  schedule:
    # 03:00 UTC every day.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-submodules
  cancel-in-progress: true

jobs:
  update:
    name: Follow submodule upstreams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # PAT_TOKEN is optional. The repository GITHUB_TOKEN is sufficient
          # for the same-workflow Nightly Build trigger below.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Update all submodules to their configured upstream branches
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive --remote

          echo "Repository status after upstream sync:"
          git status --short --ignore-submodules=none

      - name: Commit and push changed submodule pointers
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet --ignore-submodules=none; then
            echo "No upstream submodule changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream submodules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
