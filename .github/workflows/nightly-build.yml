name: Nightly Build

on:
  # The daily updater commits only when an upstream submodule moved. This
  # workflow runs after that updater and filters out no-op days.
  workflow_run:
    workflows:
      - Update submodules daily
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

env:
  BUILD_PROXY: ${{ secrets.BUILD_PROXY }}
  TRUSTED_CLIENT_PRIVATE_KEY: ${{ secrets.SCARDICE_TRUSTED_CLIENT_PRIVATE_KEY }}
  SIGN_CLIENT_PRIVATE_KEY: ${{ secrets.SCARDICE_SIGN_CLIENT_PRIVATE_KEY }}
  SIGN_V3_URL: ${{ secrets.SCARDICE_SIGN_V3_URL }}

jobs:
  check:
    name: Check whether upstream moved
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      checkout_ref: ${{ steps.decision.outputs.checkout_ref }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Decide whether to build
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          SYNC_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SYNC_BASE_SHA: ${{ github.event.workflow_run.head_sha }}
          SYNC_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$SYNC_CONCLUSION" != "success" ]]; then
            echo "The upstream sync workflow did not succeed; skipping Nightly Build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "$SYNC_BRANCH"
          latest_sha="$(git rev-parse "origin/${SYNC_BRANCH}")"
          latest_subject="$(git log -1 --format=%s "$latest_sha")"

          # A no-op sync leaves origin/dev at the same SHA as the workflow's
          # starting point. Only the updater's exact commit message qualifies.
          if [[ "$latest_sha" == "$SYNC_BASE_SHA" || "$latest_subject" != "chore: sync upstream submodules" ]]; then
            echo "No new upstream submodule commit detected; skipping Nightly Build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream sync commit detected: $latest_sha"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$latest_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish Nightly
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected source with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.checkout_ref }}
          submodules: recursive
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Scardice-core/go.mod
          cache: false

      - name: Set up Node and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Scardice-core/Scardice-ui/pnpm-lock.yaml

      - name: Install build utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep zip

      - name: Prepare optional signing files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${TRUSTED_CLIENT_PRIVATE_KEY:-}" ]]; then
            mkdir -p Scardice-core/signature
            printf '%s' "$TRUSTED_CLIENT_PRIVATE_KEY" > Scardice-core/signature/seal_trusted_private_key.pem
          fi
          if [[ -n "${SIGN_CLIENT_PRIVATE_KEY:-}" ]]; then
            mkdir -p Scardice-core/signature
            printf '%s' "$SIGN_CLIENT_PRIVATE_KEY" > Scardice-core/signature/seal_sign_private_key.bin
          fi
          if [[ -n "${SIGN_V3_URL:-}" ]]; then
            mkdir -p Scardice-core/signature
            printf '%s' "$SIGN_V3_URL" > Scardice-core/signature/SealSignV3Url
          fi

      - name: Run the default nightly build
        working-directory: Scardice-core
        shell: bash
        run: |
          set -euo pipefail

          export PACK_RUNTIME_ASSETS=1
          export RUNTIME_ASSETS_STRICT=1
          export RUNTIME_CACHE_TTL_SECONDS=86400
          export DOWNLOAD_RETRIES=3
          export RUNTIME_AXEL_CONNECTIONS=4

          input_lines=(
            ""
            "-dev"
            "dev"
            "Scardice"
            "multi"
            "linux/amd64,windows/amd64,darwin/arm64"
            "n"
            "n"
          )
          if command -v upx >/dev/null 2>&1; then
            input_lines+=(n)
          fi

          printf '%s\n' "${input_lines[@]}" | bash ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/nightly-build.log"

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail
          find Scardice-core/output -maxdepth 1 -type f -print -exec ls -lh {} \; | sort

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-log-${{ github.run_number }}
          path: nightly-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Replace the single Nightly Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: nightly
          commit: ${{ needs.check.outputs.checkout_ref }}
          name: Nightly
          body: |
            自动构建的 Nightly 版本。

            Source: `${{ needs.check.outputs.checkout_ref }}`
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: true
          removeArtifacts: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: Scardice-core/output/*
